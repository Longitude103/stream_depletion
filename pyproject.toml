[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "stream_depletion"
description = "Python bindings and CLI for the stream_depletion Rust crate (SDF / Glover / URF lagging)."
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Longitude 103" }]
keywords = ["sdf", "glover", "urf", "stream-depletion", "south-platte", "recharge"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stream-depletion = "stream_depletion.cli:main"

[project.urls]
Repository = "https://github.com/Longitude103/stream_depletion"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "stream_depletion._native"
python-source = "python"
features = ["python", "pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
